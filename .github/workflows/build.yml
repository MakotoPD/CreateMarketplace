name: Build and Release

# Gałąź portu na 1.20.1. Osobny plik od gałęzi main, bo różni się cały
# łańcuch narzędzi: ForgeGradle 6 zamiast ModDevGradle, Gradle 8.1.1 zamiast 9.x
# i JDK 17 zamiast 21.
on:
  push:
    branches: [ "1.20.1" ]
  pull_request:
    branches: [ "1.20.1" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    # JDK 17, nie 21: Gradle 8.1.1 (wymagany przez ForgeGradle 6) nie startuje
    # na 21 — "unsupported class file major version 65".
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ForgeGradle dekompiluje Minecrafta przy pierwszym uruchomieniu — to trwa
    # kilka minut i potrzebuje pamięci ponad domyślną.
    - name: Build with Gradle
      run: ./gradlew build --no-daemon

    - name: Get mod version
      id: version
      run: echo "version=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MarketplaceMod-1.20.1
        path: build/libs/*.jar

    # Tag musi zawierać wersję Minecrafta — obie gałęzie mają ten sam
    # mod_version, więc samo v0.5.0 zderzyłoby się z wydaniem z main.
    - name: Publish GitHub Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}-mc1.20.1
        name: Create Marketplace v${{ steps.version.outputs.version }} (MC 1.20.1)
        files: build/libs/create_marketplace-*.jar
        generate_release_notes: true
