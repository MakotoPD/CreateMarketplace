# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# ForgeGradle dekompiluje i rekompiluje Minecrafta - 1G nie wystarcza.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 6 nie wspiera configuration cache.
org.gradle.configuration-cache=false

# Parchment dla 1.20.1 (przez wtyczke librarian, nie ModDevGradle)
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Environment Properties
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
# Forge 47 - to jest loader dla 1.20.1. Create 6.0.8 wymaga [47.1.3,), Numismatics [47,).
forge_version=47.4.0
forge_version_range=[47.1.3,)
loader_version_range=[47,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=create_marketplace
# The human-readable display name for the mod.
mod_name=Create: Marketplace
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=GPL-3.0-only
# The mod version. See https://semver.org/
mod_version=0.5.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=pl.makoto.createmarketplace

# Dependency versions (jary lezace w libs/)
create_version=1.20.1-6.0.8
numismatics_version=1.0.15+forge-mc1.20.1
xaeros_minimap_version=forge-1.20.1-26.4.2
emi_version=1.1.22+1.20.1
jei_version=15.21.0.148

# WAŻNE: Gradle 8.1.1 (wymagany przez ForgeGradle 6) nie startuje na JDK 21 —
# "unsupported class file major version 65". Minecraft 1.20.1 celuje w Javę 17,
# więc buduj tę gałąź JDK 17.
#
# Nie ustawiaj tu org.gradle.java.home — ścieżka byłaby zależna od maszyny i
# zepsułaby build wszystkim innym. Wskaż JDK 17 jednym ze sposobów:
#   * JAVA_HOME przed uruchomieniem gradlew
#   * org.gradle.java.home w ~/.gradle/gradle.properties (poza repozytorium)
#   * w CI: actions/setup-java z java-version 17
