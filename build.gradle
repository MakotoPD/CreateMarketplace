// Build dla Minecraft 1.20.1 / Forge 47.
//
// Gałąź 1.21.1 używa wtyczki 'net.neoforged.moddev', która NIE obsługuje Forge 47 —
// stąd cały łańcuch narzędzi jest tu inny: ForgeGradle 6 + librarian (Parchment).
// To jest główny powód, dla którego jeden jar nie obsłuży obu wersji: różnią się nie
// tylko API Minecrafta, ale i loader oraz toolchain kompilacji.
plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 działa na Javie 17, nie 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    // Access transformery wykrywane są z META-INF/accesstransformer.cfg
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markerselection', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'

            // Mody w libs/ to wydania z refmapami mixinów w nazwach SRG, a dev
            // działa na nazwach Parchment. Bez tego Create pada na starcie
            // (InvalidAccessorException w SystemReportAccessor).
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        data {
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
    // Create 6.x i jego zależności (Ponder, Flywheel, Registrate)
    maven {
        name = 'Jared'
        url = 'https://maven.tterrag.com/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Create / Numismatics / Xaero — jary lokalne w libs/, tak jak na gałęzi 1.21.1.
    // Mod nie importuje ich klas w czasie kompilacji (cała integracja idzie przez
    // refleksję i NBT), więc są potrzebne wyłącznie do uruchomienia w dev.
    //
    // To są wydane, zreobfuskowane jary: ich refmapy mixinów celują w nazwy SRG
    // (f_143509_), a runtime dev ForgeGradle używa nazw Parchment. Rozwiązuje to
    // remapowanie refmap w runtime, włączone w bloku runs przez mixin.env.* —
    // fg.deobf na zależnościach plikowych nic tu nie daje.
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // JEI — dla 1.20.1 artefakt nazywa się *-forge-*, na 1.21.1 *-neoforge-*
    compileOnly "mezz.jei:jei-1.20.1-forge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-1.20.1-forge:${jei_version}"

    // EMI
    compileOnly "dev.emi:emi-forge:${emi_version}"
    runtimeOnly "dev.emi:emi-forge:${emi_version}"

    // Testy — bez zależności od Minecrafta, przechodzą z gałęzi 1.21.1 bez zmian.
    testImplementation 'net.jqwik:jqwik:1.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'fabric.mod.json']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'MakotoPD',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : 'MakotoPD'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

sourceSets {
    test {
        java { srcDir 'src/test/java' }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
