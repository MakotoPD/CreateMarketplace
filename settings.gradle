pluginManagement {
    repositories {
        gradlePluginPortal()
        // ForgeGradle 6 — jedyny toolchain obsługujący Forge 47 / MC 1.20.1
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        // librarian — mapowania Parchment dla ForgeGradle
        maven {
            name = 'ParchmentMC'
            url = 'https://maven.parchmentmc.org'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
